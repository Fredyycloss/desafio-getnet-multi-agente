services:
  api:
    environment:
      # Offline mode: local Qwen even if a cloud key exists in .env.
      LLM_PROVIDER: ollama
      OLLAMA_ENABLED: "true"
      OLLAMA_REQUIRED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:1.7b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      ollama:
        condition: service_healthy

