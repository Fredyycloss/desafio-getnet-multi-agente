name: Quality gates and container smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Compile backend
        run: python -m compileall -q app
        working-directory: backend
      - name: Run real component and API tests
        run: python -m pytest -q
        working-directory: backend
        env:
          PYTHONPATH: .
          OLLAMA_ENABLED: 'false'
          KNOWLEDGE_CRAWL_ENABLED: 'false'
      - name: Run challenge evaluation dataset
        run: python -m app.evaluation.run_eval
        working-directory: backend
        env:
          PYTHONPATH: .
          OLLAMA_ENABLED: 'false'
          KNOWLEDGE_CRAWL_ENABLED: 'false'
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies (lockfile)
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build production frontend
        run: npm run build
        working-directory: frontend
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Install frontend dependencies (lockfile)
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Login → product → ambiguous menu → numeric selection → attendant → protocol status
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python

  docker-integration:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-build, browser-e2e]
    env:
      OLLAMA_ENABLED: 'false'
      KNOWLEDGE_CRAWL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Verify API and web
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://localhost:8000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"ready":true' /tmp/health.json
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://localhost:8080/ > /tmp/web.html; then break; fi
            sleep 2
          done
          grep -qi 'Getnet' /tmp/web.html
          curl --silent --show-error --fail http://localhost:8000/api/agents | grep -q 'SupervisorAgent'
          docker compose ps
      - name: Stop stack
        if: always()
        # The job runner is isolated, but keep the cleanup command volume-safe so
        # it cannot be copied into a developer workflow that deletes model/data.
        run: docker compose down --remove-orphans
